<title>Scent Log</title>
<style>
:root {
  /* warm palette, dark (revised) as default; light overrides below.
     Every token re-picked per scheme rather than reused — see CHANGES.md. */
  --bg: #0c0a0c;
  --bg-fade: rgba(12,10,12,0.93);
  --card: #1a1719;
  --card-soft: #0c0a0c;
  --field: #231f21;
  --field-soft: #1a1719;
  --ink: #f4efe8;
  --soft: #aa9e94;
  --faint: #93877d;
  --line: #332c30;
  --hair: #282225;
  --toast-bg: #231f21;
  --card-shadow: inset 0 1px 0 rgba(255,255,255,0.05);
  --gold: #e0ab5e;
  --gold-fill: #e0ab5e1c;
  --gold-line: #e0ab5e3d;
  --wine: #d2687c;
  --wine-fill: #d2687c1c;
  --sage: #7f9873;
  --sage-fill: #7f98731c;
  --danger: #d9635a;
  --danger-fill: #d9635a1c;
  --on-acc: #1b0f10;
  --r-card: 12px;
  --r-ctl: 9px;
  --track: 0.08em;
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', system-ui, sans-serif;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: #f4eee3;
    --bg-fade: rgba(244,238,227,0.93);
    --card: #fffcf6;
    --card-soft: #faf5ea;
    --field: #ece4d5;
    --field-soft: #f3ecdf;
    --ink: #241f1b;
    --soft: #63594e;
    --faint: #6f6357;
    --line: #e2d8c6;
    --hair: #ece4d6;
    --toast-bg: #fffcf6;
    --card-shadow: 0 1px 2px rgba(72,54,28,0.06), 0 5px 16px rgba(72,54,28,0.05);
    --gold: #8c5c16;
    --gold-fill: #8c5c161c;
    --gold-line: #8c5c163d;
    --wine: #ab3a56;
    --wine-fill: #ab3a561c;
    --sage: #4c6a3e;
    --sage-fill: #4c6a3e1c;
    --danger: #b03c2c;
    --danger-fill: #b03c2c1c;
    --on-acc: #fffdf9;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { background: var(--bg); }
body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--ink);
}
input, textarea, button, select { font: inherit; color: inherit; }
a { color: var(--gold); text-decoration: none; }
a:hover { color: var(--wine); }
::-webkit-scrollbar { width: 0; height: 0; }

.app {
  max-width: 480px;
  margin: 0 auto;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  position: relative;
}

/* header */
.hdr {
  position: sticky; top: 0; z-index: 20;
  background: var(--bg-fade); backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
  padding: 14px 16px 12px;
  display: flex; align-items: baseline; gap: 8px;
}
.hdr-title { font-size: 17px; font-weight: 650; letter-spacing: -0.02em; color: var(--ink); }
.hdr-meta { font-size: 11px; color: var(--faint); }
.hdr-spacer { flex: 1 1 auto; }
.hdr-overdue {
  font-size: 10px; font-weight: 700; padding: 4px 9px; border-radius: 20px; border: none;
  background: var(--wine); color: var(--on-acc); cursor: pointer; letter-spacing: 0.02em;
}

.main { flex: 1 1 auto; padding: 16px 14px 22px; display: flex; flex-direction: column; gap: 26px; }

/* section header */
.shead { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.shead-icon {
  width: 30px; height: 30px; border-radius: 9px; display: flex; align-items: center;
  justify-content: center; flex: 0 0 auto;
}
.shead-icon svg { width: 16px; height: 16px; }
.shead-text { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.shead-title { font-size: 15px; font-weight: 600; letter-spacing: var(--track); color: var(--ink); text-transform: uppercase; }
.shead-sub { font-size: 11.5px; line-height: 1.35; color: var(--soft); }
.shead-spacer { flex: 1 1 auto; }
.shead-count { font-size: 11px; font-variant-numeric: tabular-nums; color: var(--faint); flex: 0 0 auto; }

.card {
  border-radius: var(--r-card); background: var(--card); border: 1px solid var(--line);
  box-shadow: var(--card-shadow); overflow: hidden;
}
.card-pad { padding: 14px 13px; }
.dashed {
  border-radius: var(--r-card); border: 1px dashed var(--gold-line); background: var(--card-soft);
}
.empty {
  border-radius: var(--r-card); border: 1px dashed var(--line); padding: 16px 14px;
  font-size: 12px; color: var(--soft); line-height: 1.5;
}

input, textarea, select {
  width: 100%; padding: 10px 11px; border-radius: var(--r-ctl); border: 1px solid var(--line);
  background: var(--field); color: var(--ink); font-size: 12.5px; outline: none;
}
input::placeholder, textarea::placeholder { color: var(--faint); }
input:focus, textarea:focus, select:focus { border-color: var(--gold); box-shadow: 0 0 0 3px var(--gold-fill); }
textarea { resize: none; }

button { border-radius: var(--r-ctl); border: 1px solid var(--line); background: transparent; color: var(--ink); cursor: pointer; }
button:active { transform: scale(0.98); }
.btn-primary { width: 100%; padding: 12px; border: none; background: var(--wine); color: var(--on-acc); font-size: 13px; font-weight: 650; }
.btn-line { width: 100%; padding: 12px; border: 1px solid var(--line); background: transparent; color: var(--ink); font-size: 13px; font-weight: 600; }

.chip-row { display: flex; gap: 6px; flex-wrap: wrap; }
.chip {
  padding: 6px 12px; border-radius: 20px; border: 1px solid var(--line); background: transparent;
  color: var(--faint); font-size: 11.5px; font-weight: 600; cursor: pointer; white-space: nowrap;
}
.chip.on { border-color: transparent; }

.ac-wrap { position: relative; }
.ac-dropdown {
  position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 30;
  background: var(--field); border: 1px solid var(--line); border-radius: var(--r-ctl);
  overflow: hidden; max-height: 240px; overflow-y: auto;
  box-shadow: 0 8px 24px rgba(0,0,0,0.25);
}
.ac-item { padding: 9px 11px; border-bottom: 1px solid var(--hair); cursor: pointer; display: flex; align-items: baseline; gap: 7px; }
.ac-item:last-child { border-bottom: none; }
.ac-item:active { background: var(--card); }
.ac-name { font-size: 12.5px; font-weight: 600; color: var(--ink); }
.ac-house { font-size: 10.5px; color: var(--faint); flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.link-action { font-size: 11.5px; font-weight: 600; color: var(--gold); cursor: pointer; }
.link-faint { font-size: 11.5px; font-weight: 600; color: var(--faint); cursor: pointer; }

/* live test */
.cp-row { padding: 11px 14px; border-bottom: 1px solid var(--hair); display: flex; flex-direction: column; gap: 7px; }
.cp-row:last-child { border-bottom: none; }
.cp-head { display: flex; align-items: center; gap: 9px; cursor: pointer; }
.cp-dot { width: 7px; height: 7px; border-radius: 50%; flex: 0 0 auto; }
.cp-label { font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--ink); width: 54px; flex: 0 0 auto; }
.cp-text { font-size: 11.5px; flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cp-status { font-size: 9.5px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; flex: 0 0 auto; }

/* tested log entry */
.entry { border-left: 3px solid var(--line); padding: 11px 13px; display: flex; flex-direction: column; gap: 5px; }
.entry-top { display: flex; align-items: baseline; gap: 7px; }
.entry-name { font-size: 13.5px; font-weight: 600; color: var(--ink); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.entry-date { font-size: 10.5px; font-variant-numeric: tabular-nums; color: var(--faint); flex: 0 0 auto; }
.entry-meta { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; font-size: 11px; color: var(--soft); }
.entry-dot { width: 3px; height: 3px; border-radius: 50%; background: var(--line); }
.entry-dry { font-size: 11.5px; color: var(--soft); line-height: 1.45; }
.entry-actions { display: flex; gap: 8px; margin-top: 2px; }

/* shelf card */
.shelf-item { display: flex; align-items: flex-start; gap: 10px; padding: 12px 13px; }
.rank-circle {
  width: 22px; height: 22px; border-radius: 50%; flex: 0 0 auto; display: flex; align-items: center;
  justify-content: center; font-size: 10.5px; font-weight: 700; font-variant-numeric: tabular-nums;
  border: 1px solid var(--wine);
}
.shelf-body { min-width: 0; flex: 1 1 auto; cursor: pointer; display: flex; flex-direction: column; gap: 3px; }
.shelf-name { font-size: 14px; font-weight: 600; color: var(--ink); letter-spacing: -0.01em; }
.shelf-meta { font-size: 11px; color: var(--soft); }
.shelf-cpw { font-size: 11px; font-variant-numeric: tabular-nums; }
.shelf-reach { flex: 0 0 auto; display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }
.shelf-reach-num { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }
.shelf-reach-label { font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--faint); }
.seg-row { display: flex; gap: 3px; padding: 0 13px; }
.seg {
  flex: 1 1 0; height: 22px; border-radius: 4px; cursor: pointer; background: var(--field);
  display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 700;
  color: var(--faint); font-variant-numeric: tabular-nums;
}
.fill-row { display: flex; align-items: center; gap: 8px; padding: 8px 13px 12px; }
.fill-track { flex: 1 1 auto; height: 4px; border-radius: 3px; background: var(--field); overflow: hidden; }
.fill-bar { height: 100%; border-radius: 3px; background: var(--soft); }
.fill-text { font-size: 10px; font-variant-numeric: tabular-nums; color: var(--faint); flex: 0 0 auto; }
.shelf-detail { padding: 12px 13px; border-top: 1px solid var(--hair); background: var(--field-soft); display: flex; flex-direction: column; gap: 10px; }
.tier-row { display: flex; gap: 9px; align-items: baseline; }
.tier-label { width: 38px; flex: 0 0 auto; font-size: 9.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; }
.tier-notes { flex: 1 1 auto; font-size: 12px; color: var(--ink); line-height: 1.45; }
.prose-label { width: 38px; flex: 0 0 auto; font-size: 9.5px; font-variant-numeric: tabular-nums; color: var(--faint); }
.prose-text { flex: 1 1 auto; font-size: 11.5px; color: var(--soft); line-height: 1.45; }
.tag-row { display: flex; gap: 5px; flex-wrap: wrap; }
.tag { padding: 4px 9px; border-radius: 20px; background: var(--field); border: 1px solid var(--line); font-size: 10.5px; color: var(--soft); }

/* wishlist */
.wish-item { border-radius: var(--r-card); border: 1px dashed var(--gold-line); background: var(--card-soft); padding: 11px 13px; display: flex; align-items: center; gap: 10px; }
.wish-name { font-size: 13.5px; font-weight: 600; color: var(--ink); }
.wish-sub { font-size: 11px; color: var(--soft); line-height: 1.4; }
.wish-test-btn { flex: 0 0 auto; padding: 7px 11px; border: 1px solid var(--gold-line); background: var(--gold-fill); color: var(--gold); font-size: 11px; font-weight: 650; }
.x-btn { flex: 0 0 auto; font-size: 15px; color: var(--faint); cursor: pointer; padding: 0 2px; background: none; border: none; }

/* passed */
.pass-item { padding: 11px 13px; display: flex; align-items: center; gap: 9px; }
.pass-name { min-width: 0; flex: 1 1 auto; font-size: 13.5px; font-weight: 600; color: var(--soft); text-decoration: line-through; text-decoration-color: var(--line); }
.pass-reason { flex: 0 0 auto; padding: 4px 9px; border-radius: 20px; background: var(--danger-fill); color: var(--danger); font-size: 10.5px; font-weight: 650; }

/* profile bars */
.bar-row { display: flex; align-items: center; gap: 9px; }
.bar-note { width: 74px; flex: 0 0 auto; font-size: 12px; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar-track { flex: 1 1 auto; height: 8px; border-radius: 3px; background: var(--field); overflow: hidden; }
.bar-fill { height: 100%; border-radius: 3px; }
.bar-meta { width: 42px; flex: 0 0 auto; text-align: right; font-size: 10.5px; font-variant-numeric: tabular-nums; color: var(--faint); }
.hair { height: 1px; background: var(--hair); }

/* temp bands */
.band-row { display: flex; flex-direction: column; gap: 4px; }
.band-top { display: flex; align-items: baseline; gap: 7px; }
.band-label { font-size: 11.5px; color: var(--ink); flex: 1 1 auto; }
.band-value { font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; }
.band-n { font-size: 10px; color: var(--faint); font-variant-numeric: tabular-nums; }
.band-track { height: 9px; border-radius: 3px; background: var(--field); overflow: hidden; }
.band-fill { height: 100%; border-radius: 3px; }

/* data */
.stat-row { display: flex; align-items: baseline; gap: 8px; }
.stat-label { font-size: 12px; color: var(--soft); flex: 1 1 auto; }
.stat-value { font-size: 13px; font-weight: 650; font-variant-numeric: tabular-nums; color: var(--ink); }
.import-note { padding: 10px 11px; border-radius: var(--r-ctl); background: var(--field); border: 1px solid var(--gold-line); font-size: 11.5px; color: var(--ink); line-height: 1.5; }
.banner { border-radius: var(--r-card); border: 1px solid var(--gold-line); background: var(--gold-fill); padding: 12px 13px; font-size: 11.5px; color: var(--gold); line-height: 1.5; display: flex; gap: 10px; align-items: flex-start; }
.banner-body { flex: 1 1 auto; }
.banner-x { flex: 0 0 auto; background: none; border: none; font-size: 15px; color: var(--gold); cursor: pointer; padding: 0; }
.reminder { padding-top: 12px; margin-top: 2px; border-top: 1px solid var(--hair); display: flex; flex-direction: column; gap: 8px; }
.reminder-text { font-size: 11.5px; color: var(--soft); line-height: 1.5; }

/* tab bar */
.tabbar {
  position: sticky; bottom: 0; z-index: 20; display: flex; background: var(--bg-fade);
  backdrop-filter: blur(12px); border-top: 1px solid var(--line); padding: 8px 6px 12px;
}

function extractNotes(text) {
  if (!text) return [];
  const lower = text.toLowerCase();
  const found = [];
  for (const term of NOTE_VOCAB) {
    if (lower.includes(term) && !found.includes(term)) found.push(term);

// ---- verified library: structured notes derived from prose at load time,
// never hand-authored, so nothing here can drift from what was actually
// verified. See PRD 3.3 / non-goals ("never fabricate note data"). ----
function structureLibraryEntry(raw) {
  return {
    house: raw.house || '', conc: raw.conc || '', family: raw.family || '',
    longevity: raw.longevity || '',
    // Not shown anywhere in the UI, but carried through so it survives a
    // library export/import round trip (PRD: library import/export, source field).
    source: raw.source || '',
    prose: { cp0: raw.cp0 || '', cp30: raw.cp30 || '', cp2h: raw.cp2h || '', cp6h: raw.cp6h || '' },
    notes: {
      top: extractNotes(raw.cp0),
      heart: extractNotes(raw.cp2h),
      base: extractNotes(raw.cp6h)
    }
  };
}

let LIBRARY = {};
function buildLibrary() {
  LIBRARY = {};
  for (const key in BUILTIN_LIBRARY) {
    LIBRARY[key] = structureLibraryEntry(BUILTIN_LIBRARY[key]);
    // BUILTIN_LIBRARY entries don't carry their own source field (they
    // predate the library import/export feature); they are, by construction,
    // the original 71 verified entries, so default them for export purposes.
    if (!LIBRARY[key].source) LIBRARY[key].source = 'v1 built-in (verified)';
  }
  try {
    const raw = localStorage.getItem('scent-custom-library');
    const custom = raw ? JSON.parse(raw) : {};
    for (const key in custom) {
      LIBRARY[key] = structureLibraryEntry(custom[key]);
      // Unlike BUILTIN_LIBRARY, custom entries (added via library import)
      // carry their own display name rather than relying on a hand-authored
      // DISPLAY_NAMES entry, so every lookup of this key renders correctly.
      if (custom[key].name) DISPLAY_NAMES[key] = custom[key].name;
    }
  } catch (e) {}
}

function lookupLibrary(name) {
  const key = (name || '').trim().toLowerCase();
  if (!key) return null;
  if (LIBRARY[key]) return LIBRARY[key];
  const partial = Object.keys(LIBRARY).find(k => key.includes(k) || k.includes(key));
  return partial ? LIBRARY[partial] : null;
}

function displayName(name) {
  const key = (name || '').trim().toLowerCase();
  return DISPLAY_NAMES[key] || name;
}

// Real house only, never fabricated: prefer the linked shelf item's own
// house (set from the same library lookup at add time), else fall back to
// a fresh library lookup by name. Returns '' when neither knows it.
function houseFor(name, ref) {
  if (ref) {
    const c = state.collection.find(x => x.id === ref);
    if (c && c.house) return c.house;
  }
  const lib = lookupLibrary(name);
  return lib ? lib.house : '';
}

function nameWithHouse(name, house) {
  return house ? name + ' · ' + house : name;
}

function searchLibrary(query) {
  const q = (query || '').trim().toLowerCase();
  if (!q) return [];
  const results = Object.keys(LIBRARY)
    .filter(k => k.includes(q) || (LIBRARY[k].house || '').toLowerCase().includes(q))
    .map(k => ({ key: k, name: displayName(k), house: LIBRARY[k].house || '' }));
  results.sort((a, b) => {
    const aName = a.key.includes(q), bName = b.key.includes(q);
    if (aName !== bName) return aName ? -1 : 1;
    return a.name.localeCompare(b.name);
  });
  return results.slice(0, 8);
}

function newId(prefix) { return (prefix || '') + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

function readJSON(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    if (raw === null) return fallback;
    const parsed = JSON.parse(raw);
    return (parsed === null || parsed === undefined) ? fallback : parsed;
  } catch (e) { return fallback; }
}

// One-time, idempotent migration from the prior schema (flat gravitate +
// prose-only checkpoints) to v2 (reach + structured top/heart/base notes,
// consolidated per-test dry-down text). Non-destructive: nothing is
// dropped, only reshaped. Runs once; scent-meta.schemaVersion gates it.
function migrateIfNeeded() {
  // Branches purely on scent-meta.schemaVersion, never on inspecting the
  // stored data's shape. schemaVersion is only ever written by this
  // function (at the end, unconditionally) or by a successful import
  // (handleImportFile), both of which only do so once the data actually
  // is in the current shape — so by construction, if schemaVersion is
  // already current, the data is too, and re-running the transform below
  // would corrupt it (e.g. c.gravitate || 5 would stomp a real v2 reach
  // value back down to 5 on every item). Trusting the flag is what makes
  // this safe to call unconditionally on every load.
  const meta = readJSON(KEYS.meta, {});
  if (meta.schemaVersion !== SCHEMA_VERSION) {
    const oldCollection = readJSON(KEYS.collection, []);
    const oldEntries = readJSON(KEYS.entries, []);
    const oldWishlist = readJSON(KEYS.wishlist, []);

    const newCollection = oldCollection.map(c => {
      const lib = lookupLibrary(c.name);
      return {
        id: c.id || newId('c'),
        name: c.name,
        house: lib ? lib.house : '', conc: lib ? lib.conc : '', family: lib ? lib.family : '',
        reach: c.gravitate || 5,
        longevity: lib ? lib.longevity : '',
        notes: lib ? lib.notes : null,
        prose: lib ? lib.prose : null,
        notesSource: lib ? 'library' : undefined,
        seasons: lib ? suggestSeasons(lib.family) : [], occasions: [], sizeMl: null, fill: null, price: null,
        purchaseDate: null, batchCode: null, fillHistory: [],
        isSample: false, decideBy: null
      };
    });

    const findRef = (name) => {
      const k = (name || '').trim().toLowerCase();
      const hit = newCollection.find(c => c.name.trim().toLowerCase() === k);
      return hit ? hit.id : null;
    };
    const bandHours = { [LONG_FAST]: 1.5, [LONG_MOD]: 4, [LONG_LONG]: 8, [LONG_ALL]: 11 };
    const newEntries = oldEntries.map(e => {
      const parts = [];
      if (e.cp0) parts.push('0 min: ' + e.cp0);
      if (e.cp30) parts.push('30 min: ' + e.cp30);
      if (e.cp2h) parts.push('2 hr: ' + e.cp2h);
      if (e.cp6h) parts.push('6 hr: ' + e.cp6h);
      if (e.notes) parts.push(e.notes);
      return {
        id: e.id || newId('e'), ref: findRef(e.name), name: e.name,
        date: e.date || todayISO(), site: e.site || '',
        longevity: e.longevity || LONG_MOD,
        hours: bandHours[e.longevity] || 4,
        tempC: null, rh: null,
        dry: parts.join('. ')
      };
    });

    const newWishlist = oldWishlist.map(w => ({
      id: w.id || newId('w'), name: w.name, house: '', note: w.note || ''
    }));

    localStorage.setItem(KEYS.collection, JSON.stringify(newCollection));
    localStorage.setItem(KEYS.entries, JSON.stringify(newEntries));
    localStorage.setItem(KEYS.wishlist, JSON.stringify(newWishlist));
    if (localStorage.getItem(KEYS.passed) === null) localStorage.setItem(KEYS.passed, '[]');
  }

  localStorage.setItem(KEYS.meta, JSON.stringify({ schemaVersion: SCHEMA_VERSION }));
}

// One-time backfill: fills in a season guess for any collection item that
// has a known family but no seasons tagged yet (covers bottles added before
// this feature existed). Never touches an item that already has a season
// tagged, even one — that's a user's own choice, not a gap to fill. Gated
// separately from schema migration so it still runs for accounts already
// on schemaVersion 2.
function backfillSeasonSuggestions() {
  const meta = readJSON(KEYS.meta, {});
  if (meta.seasonsSuggested) return;
  const collection = readJSON(KEYS.collection, []);
  let changed = false;
  collection.forEach(c => {
    if ((!c.seasons || c.seasons.length === 0) && c.family) {
      const guess = suggestSeasons(c.family);
      if (guess.length) { c.seasons = guess; changed = true; }
    }
  });
  if (changed) localStorage.setItem(KEYS.collection, JSON.stringify(collection));
  meta.seasonsSuggested = true;
  localStorage.setItem(KEYS.meta, JSON.stringify(meta));
}

function loadState() {
  state.collection = readJSON(KEYS.collection, []);
  state.entries = readJSON(KEYS.entries, []);
  state.wishlist = readJSON(KEYS.wishlist, []);
  state.passed = readJSON(KEYS.passed, []);
  state.activeTest = readJSON(KEYS.activeTest, null);
}

function persist() {
  localStorage.setItem(KEYS.collection, JSON.stringify(state.collection));
  localStorage.setItem(KEYS.entries, JSON.stringify(state.entries));
  localStorage.setItem(KEYS.wishlist, JSON.stringify(state.wishlist));
  localStorage.setItem(KEYS.passed, JSON.stringify(state.passed));
  localStorage.setItem(KEYS.activeTest, JSON.stringify(state.activeTest));
}

function snapshot() {
  return {
    collection: JSON.parse(JSON.stringify(state.collection)),
    entries: JSON.parse(JSON.stringify(state.entries)),
    wishlist: JSON.parse(JSON.stringify(state.wishlist)),
    passed: JSON.parse(JSON.stringify(state.passed)),
    activeTest: JSON.parse(JSON.stringify(state.activeTest))
  };
}
function restoreSnapshot(snap) {
  state.collection = snap.collection; state.entries = snap.entries;
  state.wishlist = snap.wishlist; state.passed = snap.passed; state.activeTest = snap.activeTest;
  persist();
}

let toastTimer = null;
function showToast(msg, undoSnap) {
  if (toastTimer) clearTimeout(toastTimer);
  state.toast = msg; state.undoSnapshot = undoSnap || null;
  renderToast();
  toastTimer = setTimeout(() => { state.toast = null; state.undoSnapshot = null; renderToast(); }, 5000);
}
function removeWithUndo(listKey, id, label) {
  const before = snapshot();
  state[listKey] = state[listKey].filter(x => x.id !== id);
  persist();
  showToast(label + ' removed', before);
  renderActiveTab(); renderHeader();
}

// ---- profile (signed weighting, PRD 3.1 + 3.2) ----
function weightForReach(reach) {
  if (reach <= 3) return -(4 - reach);
  if (reach <= 6) return 0;
  return reach - 6;
}
function buildProfile() {
  const map = {};
  const bump = (note, w, name) => {
    if (!map[note]) map[note] = { note, w: 0, bottles: [] };
    map[note].w += w;
    if (map[note].bottles.indexOf(name) < 0) map[note].bottles.push(name);
  };
  state.collection.forEach(c => {
    if (!c.notes) return;
    const w = weightForReach(c.reach);
    if (w === 0) return;
    ['top', 'heart', 'base'].forEach(tier => (c.notes[tier] || []).forEach(n => bump(n, w, c.name)));
  });
  state.passed.forEach(p => {
    if (!p.notes) return;
    ['top', 'heart', 'base'].forEach(tier => (p.notes[tier] || []).forEach(n => bump(n, -2, p.name)));
  });
  const all = Object.values(map);
  return {
    likes: all.filter(x => x.w > 0).sort((a, b) => b.w - a.w).slice(0, 6),
    avoids: all.filter(x => x.w < 0).sort((a, b) => a.w - b.w).slice(0, 5),
    signalBottles: state.collection.filter(c => c.notes && weightForReach(c.reach) !== 0).length
  };
}

// Phase 3.4: note pairing detection. Only ever looks at positively-weighted
// (reach >= 7) bottles — "high-rated" per the PRD's own phrasing — and only
// surfaces a pair once at least 3 distinct bottles carry both notes
// together, exactly the PRD's threshold. Beyond the count, it also checks
// whether the note pulls its weight alone: if there are positive bottles
// with note A but not note B, and those average a lower weight than the
// A+B bottles, that's what earns the "less so on its own" phrasing: PRD's
// own example is a comparison claim, not just a co-occurrence count.
function computeNotePairings() {
  const positive = state.collection
    .filter(c => c.notes && weightForReach(c.reach) > 0)
    .map(c => {
      const all = ['top', 'heart', 'base'].reduce((a, k) => a.concat(c.notes[k] || []), []);
      return { name: c.name, weight: weightForReach(c.reach), notes: Array.from(new Set(all)) };
    });

  const pairs = {};
  positive.forEach(b => {
    for (let i = 0; i < b.notes.length; i++) {
      for (let j = i + 1; j < b.notes.length; j++) {
        const [a, c] = [b.notes[i], b.notes[j]].sort();
        const key = a + '|' + c;
        if (!pairs[key]) pairs[key] = { a, b: c, bottles: [] };
        pairs[key].bottles.push(b);
      }
    }
  });

  const qualifying = Object.values(pairs).filter(p => p.bottles.length >= 3);
  qualifying.sort((x, y) => y.bottles.length - x.bottles.length);

  return qualifying.slice(0, 3).map(p => {
    const withBoth = p.bottles;
    const avgWith = withBoth.reduce((s, b) => s + b.weight, 0) / withBoth.length;
    const aAlone = positive.filter(b => b.notes.includes(p.a) && !b.notes.includes(p.b));
    const avgAlone = aAlone.length ? aAlone.reduce((s, b) => s + b.weight, 0) / aAlone.length : null;
    const A = titleCaseNote(p.a), B = titleCaseNote(p.b);
    let text;
    if (aAlone.length === 0) {
      text = 'You consistently gravitate toward ' + A + ' when it is paired with ' + B + ' — every one of your top-rated bottles with ' + A + ' also has ' + B + '.';
    } else if (avgAlone < avgWith) {
      text = 'You consistently gravitate toward ' + A + ' when it is paired with ' + B + ', less so on its own.';
    } else {
      text = 'You consistently gravitate toward the combination of ' + A + ' and ' + B + ', across ' + withBoth.length + ' of your top bottles.';
    }
    return { text, count: withBoth.length };
  });
}

function tempBandsFor(entries) {
  const bands = [
    { key: 'cool', label: 'Under 22C', min: -99, max: 22 },
    { key: 'mild', label: '22 to 28C', min: 22, max: 28 },
    { key: 'hot', label: 'Above 28C', min: 28, max: 99 }
  ];
  return bands.map(b => {
    const hit = entries.filter(e => e.hours != null && e.tempC != null && e.tempC >= b.min && e.tempC < b.max);
    const avg = hit.length ? hit.reduce((s, e) => s + e.hours, 0) / hit.length : null;
    return { key: b.key, label: b.label, avg, n: hit.length };
  });
}

function knownNames() {

// ---- Phase 2.3: checkpoint notifications ----
// iOS Safari (outside an installed home-screen PWA) has no Notification API
// at all, and even installed, scheduled delivery while the app is fully
// closed is unreliable (PRD 2.2/2.3). So this only ever promises delivery
// for the current session via setTimeout while the tab/app stays open; the
// always-on fallback is the overdue detection in checkpointRows(), which is
// pure timestamp math against activeTest.startedAt and needs no permission,
// no timer, and survives a closed app or full reload.
const NOTIF_DENIED_SHOWN_KEY = 'scent-notif-denied-shown';
let checkpointTimers = [];

function notificationStatus() {
  if (typeof Notification === 'undefined') return 'unsupported';
  return Notification.permission; // 'default' | 'granted' | 'denied'
}

function notifyNoteText() {
  const status = notificationStatus();
  if (status === 'granted') return 'Notifications are on. You will get a ping at each checkpoint while this stays open.';
  if (status === 'denied') return 'Notifications are blocked. Missed checkpoints show up here when you open the app.';
  if (status === 'unsupported') return 'Notifications are not available in this browser. Missed checkpoints show up here when you open the app.';
  return 'Missed checkpoints show up here when you open the app.';
}

// Requested only from the start-test action itself, never on load. Resolves
// immediately (no browser prompt) once the user has answered once, since
// Notification.permission only reads 'default' before a first answer.
async function ensureNotificationPermission() {
  if (typeof Notification === 'undefined') return 'unsupported';
  if (Notification.permission === 'default') {
    try { await Notification.requestPermission(); } catch (e) {}
  }
  return Notification.permission;
}

function notifyDeniedOnce(status) {
  if (status !== 'denied' && status !== 'unsupported') return;
  if (localStorage.getItem(NOTIF_DENIED_SHOWN_KEY)) return;
  localStorage.setItem(NOTIF_DENIED_SHOWN_KEY, '1');
  showToast(
    status === 'unsupported'
      ? "This browser can't do checkpoint notifications. You'll see missed ones marked overdue when you reopen the app."
      : 'Notifications are blocked. You will still see missed checkpoints marked overdue when you reopen the app.',
    null
  );
}

function clearCheckpointTimers() {
  checkpointTimers.forEach(id => clearTimeout(id));
  checkpointTimers = [];
}

// Arms setTimeout callbacks for whichever checkpoints are still ahead of
// now. Called on test start and again on app open if a test is already
// active, since a fresh page load has no memory of previously-armed timers.
// Live-refreshes the in-app overdue state on fire even without permission,
// so the header badge and card update the moment a checkpoint comes due
// without waiting for the user to touch anything.
function scheduleCheckpointTimers() {
  clearCheckpointTimers();
  const at = state.activeTest;
  if (!at) return;
  const now = Date.now();
  CP_DEFS.forEach(def => {
    if (def.mins === 0) return;
    const due = at.startedAt + def.mins * 60000;
    const delay = due - now;
    if (delay <= 0) return;
    const startedAtSnapshot = at.startedAt;
    const id = setTimeout(() => fireCheckpointDue(startedAtSnapshot, def), delay);
    checkpointTimers.push(id);
  });
}

function fireCheckpointDue(startedAtSnapshot, def) {
  const at = state.activeTest;
  if (!at || at.startedAt !== startedAtSnapshot) return;
  if ((at.cps || {})[def.mins]) return;
  if (notificationStatus() === 'granted') {
    try {
      const n = new Notification('Scent Log', {
        body: def.label + ' checkpoint due for ' + at.name,
        tag: 'scentlog-cp-' + def.mins
      });
      n.onclick = () => { try { window.focus(); } catch (e) {} };
    } catch (e) {}
  }
  renderHeader();
  if (state.tab === 'test') renderActiveTab();
}

function checkpointRows() {
  const at = state.activeTest;
  if (!at) return [];
  const now = Date.now();
  return CP_DEFS.map(def => {
    const val = (at.cps || {})[def.mins] || '';
    const due = at.startedAt + def.mins * 60000;
    const recorded = !!val;
    const overdue = !recorded && now > due + 60000;
    const dotVar = recorded ? 'var(--sage)' : overdue ? 'var(--wine)' : 'var(--faint)';
    const textColor = recorded ? 'var(--soft)' : overdue ? 'var(--wine)' : 'var(--faint)';
    const text = recorded ? val : overdue ? 'Missed. Record it now, approximate is fine.' : 'Waiting';
    const status = recorded ? 'recorded' : overdue ? 'overdue' : 'upcoming';
    return { def, val, recorded, overdue, dotVar, textColor, text, status };
  });
}

// ---- Shelf tab: what to wear, my shelf, want to try, passed on ----
// PRD 4.3: "given fill history over time, estimate a depletion date." Fits a
// simple linear regression (least squares) over every recorded fill reading
// rather than just the first/last two points, so a noisy or uneven history
// doesn't swing the estimate on one bad reading. Returns null when there's
// not enough history yet, or when fill isn't actually trending down (a
// single reading, or one that went up because the user corrected a typo,
// shouldn't produce a countdown).
function estimateDepletion(item) {
  const hist = item.fillHistory || [];
  if (hist.length < 2) return null;
  const first = new Date(hist[0].date).getTime();
  const pts = hist.map(h => ({ x: (new Date(h.date).getTime() - first) / 86400000, y: h.fill }));
  const n = pts.length;
  const sumX = pts.reduce((s, p) => s + p.x, 0), sumY = pts.reduce((s, p) => s + p.y, 0);
  const sumXY = pts.reduce((s, p) => s + p.x * p.y, 0), sumXX = pts.reduce((s, p) => s + p.x * p.x, 0);
  const denom = n * sumXX - sumX * sumX;
  if (denom === 0) return null;
  const slope = (n * sumXY - sumX * sumY) / denom;
  if (slope >= -0.0001) return null;
  const intercept = (sumY - slope * sumX) / n;
  const dayZero = -intercept / slope;
  const depletionDate = new Date(first + dayZero * 86400000);
  const daysFromNow = Math.round((depletionDate.getTime() - Date.now()) / 86400000);
  return { date: depletionDate.toISOString().slice(0, 10), daysFromNow };
}

function computeWearPicks() {
  const scored = state.collection.filter(c => !c.isSample).map(c => {
    const seasons = c.seasons || [], occasions = c.occasions || [];
    const sm = seasons.indexOf(state.season) >= 0, om = occasions.indexOf(state.occasion) >= 0;
    const why = [
      sm ? 'fits ' + state.season : (seasons.length ? 'tagged ' + seasons.join('/') + ', not ' + state.season : 'no season tagged'),
      om ? state.occasion + ' tagged' : (occasions.length ? 'tagged ' + occasions.join('/') + ', not ' + state.occasion : 'no occasion tagged')
    ].join(' · ');
    return { name: c.name, house: c.house, reach: c.reach, fit: (sm ? 1 : 0) + (om ? 1 : 0), sm, om, why };
  }).sort((a, b) => b.fit - a.fit || b.reach - a.reach);
  const picks = scored.slice(0, 3);
  const top = scored[0];
  let caveat = '';
  if (top) {
    if (top.fit === 0) caveat = 'Nothing on your shelf is tagged for ' + state.season + ' and ' + state.occasion + '. These are ordered by reach alone, which is a fallback, not an answer.';
    else if (top.fit === 1 && !top.sm) caveat = 'Your best match here is not tagged for ' + state.season + '. Ranked on the occasion and your reach score, so treat the season as unresolved.';
    else if (top.fit === 1 && !top.om) caveat = 'Your best match here is not tagged for ' + state.occasion + '. Ranked on the season and your reach score.';
  }
  return { picks, caveat };
}

function render_Shelf_list() {
  const sorted = state.collection.filter(c => !c.isSample).sort((a, b) => b.reach - a.reach);
  const wears = {};
  state.entries.forEach(e => { if (e.ref) wears[e.ref] = (wears[e.ref] || 0) + 1; });

  const rows = sorted.map((c, i) => {
    const w = wears[c.id] || 0;
    const cpw = c.price && w > 0 ? (c.price / w) : null;
    const est = estimateDepletion(c);
    const runningLow = est && est.daysFromNow <= 60;
    const isTop = i === 0;
    const expanded = !!state.expanded[c.id];
    const tiers = c.notes ? [
      { label: 'Top', notes: (c.notes.top || []).map(titleCaseNote).join(', '), color: 'var(--gold)' },
      { label: 'Heart', notes: (c.notes.heart || []).map(titleCaseNote).join(', '), color: 'var(--wine)' },
      { label: 'Base', notes: (c.notes.base || []).map(titleCaseNote).join(', '), color: 'var(--sage)' }
    ].filter(t => t.notes) : [];
    const prose = c.prose ? [
      { label: '0 min', text: c.prose.cp0 }, { label: '30 min', text: c.prose.cp30 },
      { label: '2 hr', text: c.prose.cp2h }, { label: '6 hr', text: c.prose.cp6h }
    ].filter(x => x.text) : [];
    let segs = '';
    for (let v = 1; v <= 10; v++) {
      const on = v <= c.reach;
      segs += `<div class="seg" data-set-reach="${c.id}" data-reach-val="${v}" style="background:${on ? (isTop ? 'var(--gold)' : 'var(--wine)') : 'var(--field)'};color:${on ? 'var(--on-acc)' : 'var(--faint)'}">${v === c.reach ? v : ''}</div>`;
    }
    return `
      <div class="card">
        <div class="shelf-item">
          <div class="rank-circle" style="background:${isTop ? 'var(--gold)' : 'transparent'};color:${isTop ? 'var(--on-acc)' : 'var(--wine)'};border-color:${isTop ? 'var(--gold)' : 'var(--wine)'}">${i + 1}</div>
          <div class="shelf-body" data-toggle-shelf="${c.id}">
            <div class="shelf-name">${esc(c.name)}</div>
            <div class="shelf-meta">${esc([c.house, c.conc, c.family, LONG_SHORT[c.longevity] || c.longevity].filter(Boolean).join(' · '))}</div>
            <div class="shelf-cpw" style="color:${cpw ? 'var(--sage)' : 'var(--faint)'}">${cpw ? '$' + cpw.toFixed(0) + ' per wear · ' + w + ' logged' : (c.price ? 'No wears logged yet' : 'Add a price to see cost per wear')}</div>
          </div>
          <div class="shelf-reach">
            <div class="shelf-reach-num" style="color:${isTop ? 'var(--gold)' : 'var(--wine)'}">${c.reach}</div>
            <div class="shelf-reach-label">reach</div>
          </div>
        </div>
        <div class="seg-row">${segs}</div>
        ${c.fill != null ? `
          <div class="fill-row">
            <div class="fill-track"><div class="fill-bar" style="width:${c.fill}%;background:${runningLow ? 'var(--danger)' : c.fill < 25 ? 'var(--danger)' : 'var(--soft)'}"></div></div>
            <div class="fill-text" style="${runningLow ? 'color:var(--danger);font-weight:650' : ''}">${c.fill}%${c.sizeMl ? ' of ' + c.sizeMl + 'ml' : ''}${runningLow ? ' · ' + (est.daysFromNow <= 0 ? 'likely empty' : 'out in ' + est.daysFromNow + 'd') : ''}</div>
          </div>
        ` : `<div style="height:10px"></div>`}
        ${expanded && state.editingBottle === c.id ? renderBottleEditForm(c) : expanded ? `
          <div class="shelf-detail">
            ${tiers.length ? `<div style="display:flex;flex-direction:column;gap:8px">
              ${tiers.map(t => `<div class="tier-row"><div class="tier-label" style="color:${t.color}">${t.label}</div><div class="tier-notes">${esc(t.notes)}</div></div>`).join('')}
            </div>` : ''}
            ${prose.length ? `<div style="display:flex;flex-direction:column;gap:6px;padding-top:${tiers.length ? '9px' : '0'};${tiers.length ? 'border-top:1px solid var(--hair)' : ''}">
              ${prose.map(p => `<div class="tier-row"><div class="prose-label">${p.label}</div><div class="prose-text">${esc(p.text)}</div></div>`).join('')}
            </div>` : ''}
            ${!tiers.length && !prose.length ? `
              <div style="font-size:12px;color:var(--soft);line-height:1.5">No verified notes for this one. Nothing gets filled in from a guess. Add what you smell in Edit bottle below and it becomes yours.</div>
            ` : ''}
            ${(c.seasons && c.seasons.length) || (c.occasions && c.occasions.length) ? `<div class="tag-row">${(c.seasons || []).concat(c.occasions || []).map(t => `<div class="tag">${esc(t)}</div>`).join('')}</div>` : ''}
            <div class="row-flex" style="gap:12px">
              <div class="link-action" data-edit-bottle="${c.id}">Edit bottle</div>
              <div class="link-faint" data-remove-collection="${c.id}" data-label="${esc(c.name)}">Remove</div>
            </div>
          </div>
        ` : ''}
      </div>
    `;
  }).join('');

  return `
    <div>
      ${sectionHeader({ glyph: GLYPH.shelf, title: 'My shelf', sub: 'Ranked by how often you actually reach for it', tint: 'var(--wine)', count: String(sorted.length) })}
      <div class="row-flex" style="margin-bottom:9px">
        <div class="ac-wrap f1">
          <input id="shelfNameInput" value="${esc(state.shelfDraft)}" placeholder="Add a bottle you own" autocomplete="off">
          ${renderAcDropdown('shelfNameInput', state.shelfDraft)}
        </div>
        <button id="shelfAddBtn" style="padding:10px 14px;border:none;background:var(--wine);color:var(--on-acc);font-size:12.5px;font-weight:650;flex:0 0 auto">Add</button>
      </div>
      <div style="display:flex;flex-direction:column;gap:9px">
        ${rows || `<div class="empty">Add the bottles you own to start ranking them.</div>`}
      </div>
    </div>
  `;
}

// PRD 4.3: "surface bottles projected to run out within 60 days." A standalone
// callout above the ranked list, not just an inline badge, so a bottle
// running low is visible without expanding or scrolling past it.
function render_RunningLow() {
  const withEstimate = state.collection
    .filter(c => !c.isSample)
    .map(c => ({ c, est: estimateDepletion(c) }))
    .filter(x => x.est && x.est.daysFromNow <= 60);
  if (!withEstimate.length) return '';
  withEstimate.sort((a, b) => a.est.daysFromNow - b.est.daysFromNow);
  return `
    <div class="card card-pad" style="display:flex;flex-direction:column;gap:8px;border-color:var(--danger);margin-bottom:9px">
      <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;color:var(--danger)">Running low</div>
      ${withEstimate.map(x => `
        <div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:12px">
          <div style="color:var(--ink);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(nameWithHouse(x.c.name, x.c.house))}</div>
          <div style="color:var(--danger);flex:0 0 auto;font-weight:650">${x.est.daysFromNow <= 0 ? 'likely empty' : x.est.daysFromNow + 'd left'} · ${esc(fmtShortDate(x.est.date))}</div>
        </div>
      `).join('')}
    </div>
  `;
}

// PRD 4.4: samples/decants as a separate item type (isSample), with an
// optional decide-by date. Kept out of the ranked shelf and "what should I
// wear" (those are for bottles you've committed to), surfaced here instead
// with a nudge once the decide-by date has passed.
function render_Samples() {
  const samples = state.collection.filter(c => c.isSample);
  const today = todayISO();
  const sorted = samples.slice().sort((a, b) => {
    const ao = a.decideBy && a.decideBy < today, bo = b.decideBy && b.decideBy < today;
    if (ao !== bo) return ao ? -1 : 1;
    if (a.decideBy && b.decideBy) return a.decideBy < b.decideBy ? -1 : 1;
    if (a.decideBy) return -1;
    if (b.decideBy) return 1;
    return 0;
  });
  return `
    <div>
      ${sectionHeader({ glyph: GLYPH.wish, title: 'Samples', sub: 'Decants and samples, not yet a shelf commitment', tint: 'var(--gold)', count: String(samples.length) })}
      <div style="display:flex;flex-direction:column;gap:8px">
        ${sorted.map(s => {
          const overdue = s.decideBy && s.decideBy < today;
          return `
          <div class="card card-pad" style="display:flex;flex-direction:column;gap:8px;${overdue ? 'border-color:var(--danger)' : ''}">
            <div style="min-width:0">
              <div style="font-size:13px;font-weight:600;color:var(--ink)">${esc(nameWithHouse(s.name, s.house))}</div>
              <div style="font-size:11px;color:var(--soft)">${s.family ? esc(s.family) : 'No family on file'}</div>
            </div>
            <div class="row-flex" style="align-items:center;gap:8px">
              <div style="font-size:10.5px;color:var(--faint);flex:0 0 auto">Decide by</div>
              <input type="date" value="${s.decideBy || ''}" data-set-sample-decideby="${s.id}" style="flex:0 0 auto;width:auto;font-size:11.5px;padding:6px 8px">
            </div>
            ${overdue ? `<div style="font-size:11.5px;color:var(--danger);line-height:1.4">Past your decide-by date. Log a test or pass on it.</div>` : ''}
            <div class="row-flex" style="gap:12px">
              <div class="link-action" data-test-sample="${esc(s.name)}">Log a test</div>
              <div class="link-action" data-sample-keep="${s.id}">Add to shelf</div>
              <div class="link-faint" data-sample-pass="${s.id}" data-label="${esc(s.name)}">Pass on it</div>
            </div>
          </div>
        `;}).join('')}
        <div class="row-flex">
          <div class="ac-wrap f1">
            <input id="sampleNameInput" value="${esc(state.sampleDraft)}" placeholder="Add a sample or decant" autocomplete="off">
            ${renderAcDropdown('sampleNameInput', state.sampleDraft)}
          </div>
          <input id="sampleDecideByInput" type="date" value="${esc(state.sampleDecideByDraft)}" style="flex:0 0 auto;width:auto" title="Decide by (optional)">
          <button id="sampleAddBtn" style="padding:10px 14px;border:none;background:var(--gold);color:var(--on-acc);font-size:12.5px;font-weight:650;flex:0 0 auto">Add</button>
        </div>
        ${!samples.length ? `<div class="empty">No samples yet. Add a decant with an optional decide-by date, and you'll get a nudge here if you haven't decided by then.</div>` : ''}
      </div>
    </div>
  `;
}

function render_WantToTry() {
  return `
    <div>
      ${sectionHeader({ glyph: GLYPH.wish, title: 'Want to try', sub: 'Sample these before you buy a full bottle', tint: 'var(--gold)', count: String(state.wishlist.length) })}
      <div style="display:flex;flex-direction:column;gap:8px">
        ${state.wishlist.map(w => `
          <div class="wish-item">
            <div class="f1">
              <div class="wish-name">${esc(w.name)}</div>

        `).join('')}
        <div class="row-flex">
          <div class="ac-wrap f1">
            <input id="wishInput" value="${esc(state.wishDraft)}" placeholder="Add something you want to try" autocomplete="off">
            ${renderAcDropdown('wishInput', state.wishDraft)}
          </div>
          <button id="wishAddBtn" style="flex:0 0 auto;padding:10px 14px;border:none;background:var(--gold);color:var(--on-acc);font-size:12.5px;font-weight:650">Add</button>
        </div>
      </div>

}

function render_PassedOn() {
  return `
    <div>
      ${sectionHeader({ glyph: GLYPH.pass, title: 'Passed on', sub: 'What did not work, and why. This sharpens the profile as much as your favourites do', tint: 'var(--danger)', count: String(state.passed.length) })}
      <div style="display:flex;flex-direction:column;gap:8px">
        ${state.passed.map(p => `
          <div class="card pass-item">
            <div class="pass-name">${esc(nameWithHouse(p.name, houseFor(p.name, null)))}</div>
            <div class="pass-reason">${esc(p.reason)}</div>
            <button class="x-btn" data-remove-passed="${p.id}" data-label="${esc(p.name)}">&times;</button>

          ${state.passed.length === 0 ? `<div style="font-size:12px;color:var(--soft);line-height:1.5">Nothing here yet. When something does not work, file it with a reason. Those reasons push notes out of your profile, which is how it learns what you do not like.</div>` : ''}
          <div class="row-flex">
            <input id="passNameInput" class="f1" value="${esc(state.passDraft)}" placeholder="Fragrance name">
            <select id="passReasonSelect" style="flex:0 0 auto;width:auto">
              ${PASS_REASONS.map(r => `<option value="${esc(r)}" ${state.passReason === r ? 'selected' : ''}>${esc(r)}</option>`).join('')}

function render_Shelf() {
  return render_RunningLow() + render_Shelf_list() + render_Samples() + render_WhatToWear() + render_WantToTry() + render_PassedOn();
}


// ---- Insights tab: profile, longevity by weather, recommended ----
function render_Profile() {
  const prof = buildProfile();
  const hasProfile = prof.signalBottles >= 1 && prof.likes.length > 0;
  const maxLike = prof.likes.length ? prof.likes[0].w : 1;
  const maxAvoid = prof.avoids.length ? Math.abs(prof.avoids[0].w) : 1;
  const likeWeights = prof.likes.map(x => x.w);
  const hasSpread = prof.signalBottles >= 2 && likeWeights.some(w => w !== likeWeights[0]);
  const pairings = computeNotePairings();

  let body;
  if (!hasProfile) {
    body = `<div style="font-size:12.5px;color:var(--soft);line-height:1.5">Rate at least two bottles above 7 or below 4 to build a profile. Anything from 4 to 6 counts as no signal, so it stays out.</div>`;
  } else {
    const likesBlock = hasSpread
      ? `<div style="display:flex;flex-direction:column;gap:8px">
          ${prof.likes.map(n => `<div class="bar-row"><div class="bar-note">${esc(titleCaseNote(n.note))}</div><div class="bar-track"><div class="bar-fill" style="width:${Math.round((n.w / maxLike) * 100)}%;background:var(--gold)"></div></div><div class="bar-meta">+${n.w} · ${n.bottles.length}b</div></div>`).join('')}
        </div>`
      : `<div style="display:flex;flex-direction:column;gap:7px">
          <div style="font-size:12.5px;color:var(--ink);line-height:1.5">${esc(prof.likes.map(x => x.note).join(', '))}</div>
          <div style="font-size:11.5px;color:var(--soft);line-height:1.5">${prof.signalBottles < 2
            ? 'One bottle carries signal, so these notes all weigh the same. A single bottle cannot rank anything. Rate a second above 7 or below 4 and this becomes a ranking.'
            : 'Every note here weighs the same, so there is no order to show yet.'}</div>
        </div>`;
    body = `
      <div style="display:flex;flex-direction:column;gap:11px">
        <div style="display:flex;align-items:baseline;gap:8px">
          <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;color:var(--gold)">You gravitate toward</div>
          <div style="font-size:10.5px;color:var(--faint);flex:1 1 auto">${hasSpread ? 'weight · bottles' : ''}</div>
        </div>
        ${likesBlock}
      </div>
      <div class="hair"></div>
      <div style="display:flex;flex-direction:column;gap:9px">
        <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;color:var(--wine)">You tend to avoid</div>
        ${prof.avoids.length ? prof.avoids.map(n => `<div class="bar-row"><div class="bar-note">${esc(titleCaseNote(n.note))}</div><div class="bar-track"><div class="bar-fill" style="width:${Math.round((Math.abs(n.w) / maxAvoid) * 100)}%;background:var(--wine)"></div></div><div class="bar-meta">${n.w} · ${n.bottles.length}b</div></div>`).join('')
          : `<div style="font-size:11.5px;color:var(--soft);line-height:1.5">Nothing rated below 4 yet, so there is no negative signal. Rate a bottle you regret buying, or file one under Passed on, and this fills in.</div>`}
      </div>
      <div class="hair"></div>
      <div style="display:flex;flex-direction:column;gap:6px">
        <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;color:var(--sage)">Pairings</div>
        ${pairings.length
          ? pairings.map(p => `<div style="font-size:12px;color:var(--ink);line-height:1.5">${esc(p.text)}</div>`).join('')
          : `<div style="font-size:12px;color:var(--soft);line-height:1.5">Pairings need three bottles that share a combination. You have ${prof.signalBottles} carrying signal, so there is nothing solid to report yet.</div>`}
      </div>
    `;
  }

  return `
    <div>
      ${sectionHeader({ glyph: GLYPH.profile, title: 'Your profile', sub: "Built from your own ratings, not from anyone else's", tint: 'var(--gold)', count: prof.signalBottles + ' of ' + state.collection.length + ' carry signal' })}
      <div class="card card-pad" style="display:flex;flex-direction:column;gap:14px">${body}</div>
    </div>
  `;
}

function render_WeatherChart() {
  const bands = tempBandsFor(state.entries);
  const withData = bands.filter(b => b.avg !== null);
  const maxAvg = withData.length ? Math.max.apply(null, withData.map(b => b.avg)) : 1;
  const coolB = bands[0], hotB = bands[2];
  const thin = [coolB, hotB].filter(b => b.avg !== null && b.n < 2);
  let insight = 'Not enough spread across temperature yet. Log tests with a temperature reading, in different weather, to see the difference.';
  if (coolB.avg != null && hotB.avg != null) {
    if (thin.length > 0) {
      insight = 'Cool weather rests on ' + coolB.n + (coolB.n === 1 ? ' test' : ' tests') + ' and heat on ' + hotB.n + '. That is not enough to state a difference. Log a second test in each and this turns into a number.';
    } else {
      const diff = coolB.avg - hotB.avg;
      insight = diff > 1
        ? 'Your longevity drops about ' + diff.toFixed(1) + ' hours above 28C. Readings taken in heat are not comparable to cool weather ones.'
        : 'Temperature is not moving your longevity much so far.';
    }
  }
  const bandColor = b => b.avg >= maxAvg * 0.85 ? 'var(--sage)' : b.avg >= maxAvg * 0.6 ? 'var(--gold)' : 'var(--wine)';
  return `
    <div>
      ${sectionHeader({ glyph: GLYPH.weather, title: 'Longevity by weather', sub: 'Readings taken in different heat are not comparable', tint: 'var(--sage)', count: state.entries.length ? state.entries.filter(e => e.tempC != null).length + ' with weather' : '' })}
      <div class="card card-pad" style="display:flex;flex-direction:column;gap:12px">
        ${withData.length ? `
          <div style="display:flex;flex-direction:column;gap:10px">
            ${withData.map(b => `
              <div class="band-row">
                <div class="band-top"><div class="band-label">${b.label}</div><div class="band-value" style="color:${bandColor(b)}">${b.avg.toFixed(1)}h</div><div class="band-n">${b.n}${b.n === 1 ? ' test' : ' tests'}</div></div>
                <div class="band-track"><div class="band-fill" style="width:${Math.round((b.avg / maxAvg) * 100)}%;background:${bandColor(b)}"></div></div>
              </div>
            `).join('')}
          </div>
          <div style="font-size:12px;color:var(--soft);line-height:1.5;padding-top:2px;border-top:1px solid var(--hair)">${esc(insight)}</div>
        ` : `<div style="font-size:12.5px;color:var(--soft);line-height:1.5">Log a few tests with a temperature reading and this chart fills in.</div>`}
      </div>
    </div>
  `;
}

function render_Recommended() {
  const collectionWithSignal = state.collection.filter(c => c.notes && weightForReach(c.reach) !== 0);
  const noteSets = state.collection.filter(c => c.notes).map(c => {
    const all = ['top', 'heart', 'base'].reduce((a, k) => a.concat(c.notes[k] || []), []);
    return { name: c.name, notes: all.filter((n, i, arr) => arr.indexOf(n) === i) };
  });
  const uniqueNotes = noteSets.reduce((a, x) => a.concat(x.notes), []).filter((n, i, arr) => arr.indexOf(n) === i);
  const shared = noteSets.length >= 2 ? uniqueNotes.filter(n => noteSets.every(x => x.notes.indexOf(n) >= 0)) : [];
  const blockers = [];
  if (collectionWithSignal.length < 2) {
    blockers.push('Scoring needs at least two bottles carrying signal to know what a match even means. You have ' + collectionWithSignal.length + '. Anything ranked against that is guesswork dressed as a number.');
  } else if (shared.length <= 1) {
    blockers.push('Your rated bottles share ' + (shared.length === 0 ? 'no notes' : 'one note (' + shared[0] + ')') + ' out of ' + uniqueNotes.length + '. With no common ground there is no pattern to score against, only separate tastes.');
  } else {
    blockers.push('Your rated bottles share ' + shared.length + ' notes out of ' + uniqueNotes.length + ': ' + shared.join(', ') + '. That is the pattern scoring would lean on, and it is still thin.');
  }
  blockers.push('The library holds ' + Object.keys(BUILTIN_LIBRARY).length + ' verified entries. Nothing gets recommended from unverified data.');
  return `
    <div>
      ${sectionHeader({ glyph: GLYPH.recommend, title: 'Recommended', sub: 'Nothing to show, and here is exactly why', tint: 'var(--sage)' })}
      <div class="dashed" style="padding:14px 13px;display:flex;flex-direction:column;gap:10px">
        <div style="font-size:12.5px;color:var(--soft);line-height:1.5">Recommendations are the weakest part of the app right now. Scoring only runs against the verified library, which mostly holds bottles you already named.</div>
        <div style="display:flex;flex-direction:column;gap:7px">
          ${blockers.map(b => `<div style="display:flex;gap:8px;align-items:baseline"><div style="width:5px;height:5px;border-radius:50%;background:var(--gold);flex:0 0 auto;margin-top:5px"></div><div style="font-size:11.5px;color:var(--ink);line-height:1.45">${esc(b)}</div></div>`).join('')}
        </div>
      </div>
    </div>
  `;
}

function render_Insights() {
  return render_Profile() + render_WeatherChart() + render_Recommended();
}


// ---- Data tab: export/import, storage warning, backup reminder ----
function todayFilenameDate() {
  const d = new Date();
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
}

function doExport() {
  const bundle = {
    schemaVersion: SCHEMA_VERSION,
    exportedAt: new Date().toISOString(),
    data: {
      collection: state.collection, entries: state.entries, wishlist: state.wishlist,
      passed: state.passed, activeTest: state.activeTest
    }
  };
  const blob = new Blob([JSON.stringify(bundle, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'scent-log-backup-' + todayFilenameDate() + '.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  localStorage.setItem(LAST_EXPORT_KEY, new Date().toISOString());
  state.importErr = '';
  renderActiveTab();
}

function isValidBackup(b) {
  if (!b || typeof b !== 'object' || !b.schemaVersion || !b.data || typeof b.data !== 'object') return false;
  const d = b.data;
  if (!Array.isArray(d.collection) || !Array.isArray(d.entries) || !Array.isArray(d.wishlist)) return false;
  return true;
}

function handleImportFile(file) {
  state.importErr = '';
  const reader = new FileReader();
  reader.onload = () => {
    let bundle;
    try { bundle = JSON.parse(reader.result); }
    catch (e) { state.importErr = "That file isn't valid JSON. Nothing was changed."; renderActiveTab(); return; }
    if (!isValidBackup(bundle)) { state.importErr = "That doesn't look like a Scent Log backup. Nothing was changed."; renderActiveTab(); return; }
    const current = { bottles: state.collection.length, tests: state.entries.length };
    const incoming = { bottles: bundle.data.collection.length, tests: bundle.data.entries.length };
    const ok = confirm('This will replace your current data. You have ' + current.bottles + ' bottles and ' + current.tests +
      ' tests now; the backup has ' + incoming.bottles + ' and ' + incoming.tests + '.\n\nContinue?');
    if (!ok) { renderActiveTab(); return; }
    state.collection = bundle.data.collection; state.entries = bundle.data.entries;
    state.wishlist = bundle.data.wishlist; state.passed = bundle.data.passed || [];
    state.activeTest = bundle.data.activeTest || null;
    persist();
    localStorage.setItem(KEYS.meta, JSON.stringify({ schemaVersion: SCHEMA_VERSION }));
    location.reload();
  };
  reader.onerror = () => { state.importErr = 'Could not read that file. Nothing was changed.'; renderActiveTab(); };
  reader.readAsText(file);
}

function backupReminderText() {
  const lastExport = localStorage.getItem(LAST_EXPORT_KEY);
  const daysSince = lastExport ? (Date.now() - new Date(lastExport).getTime()) / 86400000 : Infinity;
  const total = state.collection.length + state.entries.length + state.wishlist.length;
  if (!(daysSince > 30 && total > 10)) return null;
  return lastExport
    ? "It's been over a month since your last backup. Export a fresh one to stay covered."
    : "You've logged some data and haven't backed it up yet. Export a copy now.";
}

// ---- Library import/export: merges into the custom library (scent-custom-library),
// distinct from the backup import above, which replaces the whole app state. ----

// A real CSV parser (state machine over characters), not text.split(','):
// several checkpoint descriptions in the library data contain commas inside
// quoted fields ("Rich tobacco-vanilla heart, dried fruit undertone" as one
// field), which a naive split would break across two columns. Handles quoted
// fields, doubled "" as an escaped quote, and both \n and \r\n line endings.
// See CHANGES.md for why this was written by hand instead of adding a dependency.
function parseCSV(text) {
  const rows = [];
  let row = [], field = '', inQuotes = false;
  let i = 0;
  const len = text.length;
  while (i < len) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') {
        if (text[i + 1] === '"') { field += '"'; i += 2; continue; }
        inQuotes = false; i++; continue;
      }
      field += c; i++; continue;
    }
    if (c === '"') { inQuotes = true; i++; continue; }
    if (c === ',') { row.push(field); field = ''; i++; continue; }
    if (c === '\r') { i++; continue; }
    if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; i++; continue; }
    field += c; i++;
  }
  if (field.length > 0 || row.length > 0) { row.push(field); rows.push(row); }
  return rows.filter(r => !(r.length === 1 && r[0].trim() === ''));
}

function csvRowsToObjects(rows) {
  const header = rows[0].map(h => h.trim().toLowerCase());
  return rows.slice(1).map((r, idx) => {
    const obj = { __row: idx + 2, __unit: 'row' };
    header.forEach((h, i) => { obj[h] = (r[i] !== undefined ? r[i] : '').trim(); });
    return obj;
  });
}

// Validates in memory only; nothing is written to storage here. Returns the
// rows that pass (ready to merge) and a per-row failure list so bad rows are
// reported, not silently dropped.
function validateLibraryRows(objs) {
  const valid = [];
  const failures = [];
  const seenKeys = new Set();
  objs.forEach(obj => {
    const unit = obj.__unit || 'entry';
    const label = unit + ' ' + obj.__row;
    for (const f of LIBRARY_REQUIRED_FIELDS) {
      if (!obj[f] || !String(obj[f]).trim()) {
        failures.push({ row: obj.__row, unit, reason: 'missing ' + f, label: label + ' missing ' + f });
        return;
      }
    }
    const family = String(obj.family).trim();
    if (!VALID_FAMILIES.includes(family)) {
      failures.push({ row: obj.__row, unit, reason: 'invalid family', label: label + ' invalid family' });
      return;
    }
    const longevity = String(obj.longevity).trim();
    if (!VALID_LONGEVITY.includes(longevity)) {
      failures.push({ row: obj.__row, unit, reason: 'invalid longevity', label: label + ' invalid longevity' });
      return;
    }
    const key = String(obj.key).trim().toLowerCase();
    if (seenKeys.has(key)) {
      failures.push({ row: obj.__row, unit, reason: 'duplicate key', label: label + ' duplicate key' });
      return;
    }
    seenKeys.add(key);
    valid.push({
      key, name: String(obj.name).trim(), house: String(obj.house).trim(), conc: String(obj.conc).trim(),
      family, cp0: String(obj.cp0).trim(), cp30: String(obj.cp30).trim(),
      cp2h: String(obj.cp2h).trim(), cp6h: String(obj.cp6h).trim(),
      longevity, source: String(obj.source).trim()
    });
  });
  return { valid, failures };
}

function isValidLibraryBundle(b) {
  return !!(b && typeof b === 'object' && Array.isArray(b.library));
}

function handleLibraryImportFile(file) {
  state.libraryImportMsg = null;
  const reader = new FileReader();
  reader.onload = () => {
    const text = String(reader.result);
    const looksCSV = /\.csv$/i.test(file.name) || (!/\.json$/i.test(file.name) && text.trim()[0] !== '{');
    let objs;
    if (looksCSV) {
      const rows = parseCSV(text);
      if (rows.length < 2) {
        state.libraryImportMsg = { text: "That doesn't look like a library CSV. Nothing was changed.", isError: true };
        renderActiveTab(); return;
      }
      const header = rows[0].map(h => h.trim().toLowerCase());
      const missingCols = LIBRARY_REQUIRED_FIELDS.filter(f => !header.includes(f));
      if (missingCols.length) {
        state.libraryImportMsg = { text: 'That CSV is missing required columns (' + missingCols.join(', ') + '). Nothing was changed.', isError: true };
        renderActiveTab(); return;
      }
      objs = csvRowsToObjects(rows);
    } else {
      let bundle;
      try { bundle = JSON.parse(text); }
      catch (e) { state.libraryImportMsg = { text: "That file isn't valid JSON. Nothing was changed.", isError: true }; renderActiveTab(); return; }
      if (!isValidLibraryBundle(bundle)) {
        state.libraryImportMsg = { text: "That doesn't look like a Scent Log library file. Nothing was changed.", isError: true };
        renderActiveTab(); return;
      }
      objs = bundle.library.map((r, idx) => Object.assign({ __row: idx + 1, __unit: 'entry' }, r));
    }

    const { valid, failures } = validateLibraryRows(objs);
    if (!valid.length) {
      state.libraryImportMsg = {
        text: failures.length
          ? 'Nothing imported. ' + failures.length + (failures.length === 1 ? ' row failed: ' : ' rows failed: ') + failures.map(f => f.label).join(', ') + '.'
          : 'That file has no entries. Nothing was changed.',
        isError: true
      };
      renderActiveTab(); return;
    }

    // Validation is done; only now does anything touch storage, and it's a
    // single write, not one per row (PRD: validate before writing anything).
    let custom;
    try { custom = JSON.parse(localStorage.getItem('scent-custom-library') || '{}'); }
    catch (e) { custom = {}; }
    valid.forEach(v => {
      custom[v.key] = {
        name: v.name, house: v.house, conc: v.conc, family: v.family,
        cp0: v.cp0, cp30: v.cp30, cp2h: v.cp2h, cp6h: v.cp6h,
        longevity: v.longevity, source: v.source
      };
    });
    localStorage.setItem('scent-custom-library', JSON.stringify(custom));
    buildLibrary();

    let msg = 'Imported ' + valid.length + ' ' + (valid.length === 1 ? 'entry' : 'entries') + '.';
    if (failures.length) {
      msg += ' ' + failures.length + (failures.length === 1 ? ' row skipped: ' : ' rows skipped: ') + failures.map(f => f.label).join(', ') + '.';
    }
    state.libraryImportMsg = { text: msg, isError: false };
    renderActiveTab(); renderHeader();
  };
  reader.onerror = () => { state.libraryImportMsg = { text: 'Could not read that file. Nothing was changed.', isError: true }; renderActiveTab(); };
  reader.readAsText(file);
}

function doLibraryExport() {
  const library = Object.keys(LIBRARY).map(key => {

  const bundle = { schemaVersion: LIBRARY_SCHEMA_VERSION, library };
  const blob = new Blob([JSON.stringify(bundle, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'scent-log-library-' + todayFilenameDate() + '.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
