  return {
    id: newId('c'), name,
    house: lib ? lib.house : '', conc: lib ? lib.conc : '', family: lib ? lib.family : '',
    reach: 5, longevity: lib ? lib.longevity : '',
    notes: lib ? lib.notes : null, prose: lib ? lib.prose : null,
    notesSource: lib ? 'library' : undefined,
    seasons: lib ? suggestSeasons(lib.family) : [], occasions: [], sizeMl: null, fill: null, price: null,
    purchaseDate: null, batchCode: null, fillHistory: [],
    isSample: false, decideBy: null
  };
}

function finishActiveTest() {
  const at = state.activeTest;
  if (!at) return;
  const before = snapshot();
  const hours = Math.round(((Date.now() - at.startedAt) / 3600000) * 10) / 10;
  const parts = [];
  CP_DEFS.forEach(def => { const v = (at.cps || {})[def.mins]; if (v) parts.push(def.label + ': ' + v); });
  const entry = {
    id: newId('e'), ref: at.ref || null, name: at.name, date: todayISO(),
    site: at.site || '', longevity: bandFromHours(hours), hours,
    tempC: at.tempC != null ? at.tempC : null, rh: at.rh != null ? at.rh : null,
    dry: parts.join('. ')
  };
  state.entries.push(entry);
  state.activeTest = null;
  clearCheckpointTimers();
  persist();
  showToast('Test closed and filed', before);
  renderActiveTab(); renderHeader();
}

function init() {
  buildLibrary();
  migrateIfNeeded();
  backfillSeasonSuggestions();
  loadState();
  renderHeader();
  renderTabbar();
  renderActiveTab();
  wireEvents();
  // Re-arm this session's in-session timers for a test already in progress
  // from before this load (e.g. a reload). Does not request permission —
  // that only ever happens from the start-test action itself.
  if (state.activeTest) scheduleCheckpointTimers();
}

function wireEvents() {
  document.addEventListener('click', (e) => {
    const t = e.target;

    const tabBtn = t.closest('[data-tab]');
    if (tabBtn) { switchTab(tabBtn.getAttribute('data-tab')); return; }

    if (t.closest('#hdrOverdue')) { switchTab('test'); return; }

    const cpToggle = t.closest('[data-toggle-cp]');
    if (cpToggle) {
      const mins = Number(cpToggle.getAttribute('data-toggle-cp'));
      if (state.editingCp === mins) { state.editingCp = null; state.cpDraft = ''; }
      else { state.editingCp = mins; state.cpDraft = (state.activeTest.cps || {})[mins] || ''; }
      renderActiveTab(); return;
    }
    const cpSave = t.closest('[data-save-cp]');
    if (cpSave) {
      const mins = Number(cpSave.getAttribute('data-save-cp'));
      const val = document.getElementById('cpDraftInput');
      state.activeTest.cps[mins] = val ? val.value : '';
      state.editingCp = null; state.cpDraft = '';
      persist(); renderActiveTab(); renderHeader(); return;
    }
    if (t.closest('[data-cancel-cp]')) { state.editingCp = null; state.cpDraft = ''; renderActiveTab(); return; }

    if (t.closest('#finishTestBtn')) { finishActiveTest(); return; }

    if (t.closest('#startTestBtn')) {
      const nameEl = document.getElementById('testNameInput');
      const name = nameEl ? nameEl.value.trim() : '';
      if (!name) { showToast('Name it first', null); return; }
      const match = state.collection.find(c => c.name.toLowerCase() === name.toLowerCase());
      const tempEl = document.getElementById('testTempInput'), rhEl = document.getElementById('testRhInput');
      const tempC = tempEl && tempEl.value.trim() !== '' ? Number(tempEl.value) : null;
      const rh = rhEl && rhEl.value.trim() !== '' ? Number(rhEl.value) : null;
      state.activeTest = {
        ref: match ? match.id : null, name, startedAt: Date.now(), site: '',
        tempC: isNaN(tempC) ? null : tempC, rh: isNaN(rh) ? null : rh,
        cps: { 0: '', 30: '', 120: '', 360: '' }
      };
      state.testName = ''; state.testTemp = ''; state.testRh = '';
      persist(); renderActiveTab(); renderHeader();
      ensureNotificationPermission().then(status => {
        notifyDeniedOnce(status);
        scheduleCheckpointTimers();
        if (state.activeTest && state.tab === 'test') renderActiveTab();
      });
      return;
    }

    const suggItem = t.closest('.sugg-item');
    if (suggItem) { state.testName = suggItem.getAttribute('data-name'); renderActiveTab(); return; }

    const remEntry = t.closest('[data-remove-entry]');
    if (remEntry) { removeWithUndo('entries', remEntry.getAttribute('data-remove-entry'), remEntry.getAttribute('data-label')); return; }

    const editEntryBtn = t.closest('[data-edit-entry]');
    if (editEntryBtn) { state.editingEntry = editEntryBtn.getAttribute('data-edit-entry'); renderActiveTab(); return; }
    if (t.closest('[data-cancel-entry]')) { state.editingEntry = null; renderActiveTab(); return; }
    const saveEntryBtn = t.closest('[data-save-entry]');
    if (saveEntryBtn) {
      const id = saveEntryBtn.getAttribute('data-save-entry');
      const item = state.entries.find(x => x.id === id);
      if (item) {
        const g = fid => document.getElementById(fid);
        item.date = g('editDate').value || item.date;
        item.site = g('editSite').value.trim();
        item.longevity = g('editLongevity').value;
        const hrs = parseFloat(g('editHours').value);
        item.hours = isNaN(hrs) ? item.hours : hrs;
        const tc = g('editTempC').value.trim(), rh = g('editRh').value.trim();
        item.tempC = tc === '' ? null : Number(tc);
        item.rh = rh === '' ? null : Number(rh);
        item.dry = g('editDry').value.trim();
        persist();
      }
      state.editingEntry = null;
      renderActiveTab(); return;
    }

    const filterBtn = t.closest('[data-filter]');
    if (filterBtn) { state.longFilter = filterBtn.getAttribute('data-filter'); renderActiveTab(); return; }

    const seasonBtn = t.closest('[data-season]');
    if (seasonBtn) { state.season = seasonBtn.getAttribute('data-season'); renderActiveTab(); return; }
    const occBtn = t.closest('[data-occasion]');
    if (occBtn) { state.occasion = occBtn.getAttribute('data-occasion'); renderActiveTab(); return; }

    const reachSeg = t.closest('[data-set-reach]');
    if (reachSeg) {
      const id = reachSeg.getAttribute('data-set-reach'), val = Number(reachSeg.getAttribute('data-reach-val'));
      const item = state.collection.find(c => c.id === id);
      if (item) { item.reach = val; persist(); renderActiveTab(); }
      return;
    }
    const shelfToggle = t.closest('[data-toggle-shelf]');
    if (shelfToggle) {
      const id = shelfToggle.getAttribute('data-toggle-shelf');
      state.expanded[id] = !state.expanded[id];
      renderActiveTab(); return;
    }
    const remCollection = t.closest('[data-remove-collection]');
    if (remCollection) { removeWithUndo('collection', remCollection.getAttribute('data-remove-collection'), remCollection.getAttribute('data-label')); return; }

    const editBottleBtn = t.closest('[data-edit-bottle]');
    if (editBottleBtn) {
      const id = editBottleBtn.getAttribute('data-edit-bottle');
      const item = state.collection.find(x => x.id === id);
      if (item) {
        state.editingBottle = id;
        state.bottleDraft = {
          house: item.house || '', conc: item.conc || '', family: item.family || '',
          price: item.price, sizeMl: item.sizeMl, fill: item.fill,
          purchaseDate: item.purchaseDate || '', batchCode: item.batchCode || '',
          seasons: (item.seasons || []).slice(), occasions: (item.occasions || []).slice(),
          notesTop: item.notes ? (item.notes.top || []).join(', ') : '',
          notesHeart: item.notes ? (item.notes.heart || []).join(', ') : '',
          notesBase: item.notes ? (item.notes.base || []).join(', ') : ''
        };
      }
      renderActiveTab(); return;
    }
    if (t.closest('[data-cancel-bottle]')) { state.editingBottle = null; state.bottleDraft = null; renderActiveTab(); return; }

    const editSeasonBtn = t.closest('[data-edit-season]');
    if (editSeasonBtn) {
      syncBottleDraftFromDOM();
      const k = editSeasonBtn.getAttribute('data-edit-season');
      const s = state.bottleDraft.seasons;
      const i = s.indexOf(k);
      if (i >= 0) s.splice(i, 1); else s.push(k);
      renderActiveTab(); return;
    }
    const editOccasionBtn = t.closest('[data-edit-occasion]');
    if (editOccasionBtn) {
      syncBottleDraftFromDOM();
      const k = editOccasionBtn.getAttribute('data-edit-occasion');
      const o = state.bottleDraft.occasions;
      const i = o.indexOf(k);
      if (i >= 0) o.splice(i, 1); else o.push(k);
      renderActiveTab(); return;
    }
    const saveBottleBtn = t.closest('[data-save-bottle]');
    if (saveBottleBtn) {
      syncBottleDraftFromDOM();
      const id = saveBottleBtn.getAttribute('data-save-bottle');
      const item = state.collection.find(x => x.id === id);
      const d = state.bottleDraft;
      if (item && d) {
        item.house = d.house.trim(); item.conc = d.conc.trim(); item.family = d.family.trim();
        item.price = d.price === '' || d.price == null ? null : Number(d.price);
        item.sizeMl = d.sizeMl === '' || d.sizeMl == null ? null : Number(d.sizeMl);
        item.purchaseDate = d.purchaseDate || null;
        item.batchCode = d.batchCode ? d.batchCode.trim() : null;
        const newFill = d.fill === '' || d.fill == null ? null : Math.max(0, Math.min(100, Number(d.fill)));
        // PRD 4.3: track fill over time so a depletion date can be estimated.
        // Only records a point when the value actually changed, and collapses
        // same-day edits into one point rather than letting them skew the
        // regression estimateDepletion() runs against.
        if (newFill != null && newFill !== item.fill) {
          if (!item.fillHistory) item.fillHistory = [];
          const today = todayISO();
          const last = item.fillHistory[item.fillHistory.length - 1];
          if (last && last.date === today) last.fill = newFill;
          else item.fillHistory.push({ date: today, fill: newFill });
        }
        item.fill = newFill;
        item.seasons = d.seasons; item.occasions = d.occasions;
        const notesEditable = !item.notes || item.notesSource === 'user';
        if (notesEditable) {
          const top = splitNoteList(d.notesTop), heart = splitNoteList(d.notesHeart), base = splitNoteList(d.notesBase);
          if (top.length || heart.length || base.length) {
            item.notes = { top, heart, base };
            item.notesSource = 'user';
          } else {
            item.notes = null; item.notesSource = undefined;
          }
        }
        persist();
      }
      state.editingBottle = null; state.bottleDraft = null;
      renderActiveTab(); renderHeader(); return;
    }

    if (t.closest('#shelfAddBtn')) {
      const el = document.getElementById('shelfNameInput');
      const name = el ? el.value.trim() : '';
      if (!name) return;
      state.collection.push(addCollectionItem(name));
      state.shelfDraft = ''; state.acOpenFor = null; persist(); renderActiveTab(); renderHeader(); return;
    }

    if (t.closest('#sampleAddBtn')) {
      const el = document.getElementById('sampleNameInput'), dateEl = document.getElementById('sampleDecideByInput');
      const name = el ? el.value.trim() : '';
      if (!name) return;
      const item = addCollectionItem(name);
      item.isSample = true;
      item.decideBy = dateEl && dateEl.value ? dateEl.value : null;
      state.collection.push(item);
      state.sampleDraft = ''; state.sampleDecideByDraft = ''; state.acOpenFor = null;
      persist(); renderActiveTab(); renderHeader(); return;
    }
    const testSample = t.closest('[data-test-sample]');
    if (testSample) { state.testName = testSample.getAttribute('data-test-sample'); switchTab('test'); return; }
    const sampleKeep = t.closest('[data-sample-keep]');
    if (sampleKeep) {
      const item = state.collection.find(c => c.id === sampleKeep.getAttribute('data-sample-keep'));
      if (item) { item.isSample = false; persist(); renderActiveTab(); renderHeader(); }
      return;
    }
    const samplePass = t.closest('[data-sample-pass]');
    if (samplePass) {
      const id = samplePass.getAttribute('data-sample-pass'), label = samplePass.getAttribute('data-label');
      const item = state.collection.find(c => c.id === id);
      if (item) {
        const before = snapshot();
        state.collection = state.collection.filter(c => c.id !== id);
        state.passed.push({ id: newId('p'), name: item.name, reason: PASS_REASONS[0], notes: item.notes || null });
        persist();
        showToast(label + ' passed on', before);
        renderActiveTab(); renderHeader();
      }
      return;
    }

    const testWish = t.closest('[data-test-wish]');
    if (testWish) { state.testName = testWish.getAttribute('data-test-wish'); switchTab('test'); return; }
    const remWish = t.closest('[data-remove-wishlist]');
    if (remWish) { removeWithUndo('wishlist', remWish.getAttribute('data-remove-wishlist'), remWish.getAttribute('data-label')); return; }
    if (t.closest('#wishAddBtn')) {
      const el = document.getElementById('wishInput');
      const name = el ? el.value.trim() : '';
      if (!name) return;
      state.wishlist.push({ id: newId('w'), name, house: '', note: '' });
      state.wishDraft = ''; state.acOpenFor = null; persist(); renderActiveTab(); renderHeader(); return;
    }

    const remPassed = t.closest('[data-remove-passed]');
    if (remPassed) { removeWithUndo('passed', remPassed.getAttribute('data-remove-passed'), remPassed.getAttribute('data-label')); return; }
    if (t.closest('#passAddBtn')) {
      const nameEl = document.getElementById('passNameInput'), reasonEl = document.getElementById('passReasonSelect');
      const name = nameEl ? nameEl.value.trim() : '';
      if (!name) return;
      const lib = lookupLibrary(name);
      state.passed.push({ id: newId('p'), name, reason: reasonEl ? reasonEl.value : PASS_REASONS[0], notes: lib ? lib.notes : null });
      state.passDraft = ''; persist(); renderActiveTab(); renderHeader(); return;
    }

    const acItem = t.closest('[data-ac-name]');
    if (acItem) {
      const forId = acItem.getAttribute('data-ac-for'), name = acItem.getAttribute('data-ac-name');
      state.acOpenFor = null;
      if (forId === 'shelfNameInput') {
        state.collection.push(addCollectionItem(name));
        state.shelfDraft = ''; persist(); renderActiveTab(); renderHeader();
      } else if (forId === 'wishInput') {
        state.wishlist.push({ id: newId('w'), name, house: '', note: '' });
        state.wishDraft = ''; persist(); renderActiveTab(); renderHeader();
      } else if (forId === 'sampleNameInput') {
        const dateEl = document.getElementById('sampleDecideByInput');
        const item = addCollectionItem(name);
        item.isSample = true;
        item.decideBy = dateEl && dateEl.value ? dateEl.value : null;
        state.collection.push(item);
        state.sampleDraft = ''; persist(); renderActiveTab(); renderHeader();
      }
      return;
    }

    const stub = t.closest('[data-stub]');
    if (stub) { showToast(stub.getAttribute('data-stub'), null); return; }

    if (t.closest('#exportBtn') || t.closest('#reminderExportBtn')) { doExport(); return; }
    if (t.closest('#importBtn')) { const f = document.getElementById('importFile'); if (f) f.click(); return; }
    if (t.closest('#libraryExportBtn')) { doLibraryExport(); return; }
    if (t.closest('#libraryImportBtn')) { const f = document.getElementById('libraryImportFile'); if (f) f.click(); return; }
    if (t.closest('#storageBannerDismiss')) {
      localStorage.setItem(STORAGE_BANNER_DISMISSED_KEY, '1');
      const b = document.getElementById('storageBanner'); if (b) b.classList.add('hide');
      return;
    }

    if (t.closest('#undoBtn')) {
      if (state.undoSnapshot) restoreSnapshot(state.undoSnapshot);
      state.toast = null; state.undoSnapshot = null;
      renderToast(); renderActiveTab(); renderHeader();
      return;
    }
  });

  document.addEventListener('input', (e) => {
    const id = e.target.id;
    if (id === 'searchInput') { state.search = e.target.value; renderActiveTab(); }
    else if (id === 'testNameInput') { state.testName = e.target.value; renderActiveTab(); }
    else if (id === 'testTempInput') { state.testTemp = e.target.value; }
    else if (id === 'testRhInput') { state.testRh = e.target.value; }
    else if (id === 'cpDraftInput') { state.cpDraft = e.target.value; }
    else if (id === 'shelfNameInput') { state.shelfDraft = e.target.value; state.acOpenFor = 'shelfNameInput'; renderActiveTab(); }
    else if (id === 'wishInput') { state.wishDraft = e.target.value; state.acOpenFor = 'wishInput'; renderActiveTab(); }
    else if (id === 'sampleNameInput') { state.sampleDraft = e.target.value; state.acOpenFor = 'sampleNameInput'; renderActiveTab(); }
    else if (id === 'sampleDecideByInput') { state.sampleDecideByDraft = e.target.value; }
    else if (id === 'passNameInput') { state.passDraft = e.target.value; }
  });
  document.addEventListener('change', (e) => {
    if (e.target.id === 'importFile') {
      const file = e.target.files && e.target.files[0];
      if (file) handleImportFile(file);
    } else if (e.target.id === 'libraryImportFile') {
      const file = e.target.files && e.target.files[0];
      if (file) handleLibraryImportFile(file);
      e.target.value = '';
    } else if (e.target.id === 'passReasonSelect') {
      state.passReason = e.target.value;
    } else if (e.target.hasAttribute('data-set-sample-decideby')) {
      const item = state.collection.find(c => c.id === e.target.getAttribute('data-set-sample-decideby'));
      if (item) { item.decideBy = e.target.value || null; persist(); renderActiveTab(); }
    }
  });
}

init();

</script>
</body>
</html>
